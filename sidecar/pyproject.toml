[project]
name = "voxreach-sidecar"
version = "0.1.0"
description = "VoxReach POC sidecar — transcript watcher, intent extractor, POS stub, SSE event stream"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.9",
  "httpx>=0.27",
  "sse-starlette>=2.1",
  "python-multipart>=0.0.12",
]

[project.optional-dependencies]
dev = [
  "ruff>=0.7",
  "pytest>=8.3",
]
