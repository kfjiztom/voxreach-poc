version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/web"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      next-react:
        patterns:
          - "next"
          - "react"
          - "react-dom"
          - "@types/react*"
      tooling:
        patterns:
          - "typescript"
          - "tailwindcss"
          - "postcss"
          - "autoprefixer"
          - "@types/node"

  - package-ecosystem: "pip"
    directory: "/sidecar"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
